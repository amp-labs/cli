package: openapi
generate:
  # Only generate Go types for the schemas, not server stubs.
  models: true
output-options:
  skip-prune: true
compatibility:
  # All three specs are generated into one Go package, so unprefixed enum
  # constants (e.g. "Header", "Query") collide across specs. Always prefix
  # enum values with their type name (e.g. ApiKeyOptsAttachmentTypeHeader).
  always-prefix-enum-values: true
